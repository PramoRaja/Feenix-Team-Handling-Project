name: Build Feenix Portal iOS App (.IPA)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Compile Native Swift iOS App
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode_15.2.app || true
        
      - name: Show Xcode Version
        run: xcodebuild -version
        
      - name: Build FeenixPortal.app (Archive / Release)
        run: |
          cd ios_app
          xcodebuild -project FeenixPortal.xcodeproj \
            -scheme FeenixPortal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FeenixPortal.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
            
      - name: Package into FeenixPortal.ipa
        run: |
          cd ios_app
          mkdir -p Payload
          cp -r build/FeenixPortal.xcarchive/Products/Applications/FeenixPortal.app Payload/
          zip -r FeenixPortal.ipa Payload
          ls -lh FeenixPortal.ipa
          
      - name: Upload FeenixPortal.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeenixPortal-iOS-IPA
          path: ios_app/FeenixPortal.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: ios-latest
          name: Feenix Portal iOS App (Native Swift IPA)
          body: |
            ## Feenix Portal iOS App (Native Swift)
            - **Binary**: Native Mach-O arm64 compiled via Xcode (macOS-14)
            - **Features**: WKWebView, Cookie & Session persistence, Native pull-to-refresh, Offline fallback, Native JS alerts
            - **Installation**: Use [Sideloadly](https://sideloadly.io/) or [AltStore](https://altstore.io/) to install on your iPhone.
          files: ios_app/FeenixPortal.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}